# --- Eclipse Mosquitto: lab broker with maximum diagnostics ---
per_listener_settings false
listener 1883
listener 8883
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2
listener 9001
protocol websockets

allow_anonymous false
password_file /mosquitto/config/passwd

# Diagnostics: every connect/disconnect/subscribe/publish is logged with client id, QoS, retain flag, size
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type all
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S
sys_interval 10

# Limits that commonly cause customer issues (change to reproduce)
message_size_limit 262144
max_inflight_messages 20
max_queued_messages 1000
persistent_client_expiration 1d
persistence true
persistence_location /mosquitto/data/
