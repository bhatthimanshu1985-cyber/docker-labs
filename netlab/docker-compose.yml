services:
  snmp:
    build: ./snmp
    ports:
      - "161:161/udp"
    restart: unless-stopped
  rest:
    build: ./rest
    ports:
      - "8441:8441"   # FortiGate
      - "8442:8442"   # Cisco router
      - "8443:8443"   # Cisco switch
      - "8444:8444"   # generic switch
    environment:
      TLS: "0"                 # set to 1 for HTTPS (self-signed cert)
      FGT_TOKEN: "fgt-test-token"
      CISCO_USER: "admin"
      CISCO_PASS: "admin"
    restart: unless-stopped
