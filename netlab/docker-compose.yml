services:
  snmp:
    build: {context: ., dockerfile: snmp/Dockerfile}
    ports:
      - "1161:161/udp"   # host port 1161: the host's own snmpd usually owns 161. Use "161:161/udp" if it is free.
    volumes:
      - ./scenarios:/srv/scenarios:ro      # edit scenarios/scenarios.json -> picked up within ~2 s
    restart: unless-stopped
  rest:
    build: {context: ., dockerfile: rest/Dockerfile}
    ports:
      - "8441:8441"   # FortiGate
      - "8442:8442"   # Cisco router
      - "8443:8443"   # Cisco switch
      - "8444:8444"   # generic switch
      - "8445:8445"   # FortiGate over HTTPS (self-signed) - use this for PRTG FortiGate sensors
    environment:
      TLS: "0"                 # set to 1 for HTTPS (self-signed cert)
      FGT_TOKEN: "fgt-test-token"
      CISCO_USER: "admin"
      CISCO_PASS: "admin"
      API_LOG: "1"             # log every API request (docker compose logs -f rest) - handy to see what a PRTG sensor calls
    volumes:
      - ./scenarios:/srv/scenarios:ro
    restart: unless-stopped
